min_version = "2024.11.1"

[tools]
rust = { version = "stable", components = "rustfmt,clippy" }

[vars]
dist_dir = "dist"
linux_glibc = "2.17"

[tasks."install:nightly-rustfmt"]
hide = true
description = "Ensure nightly rustfmt is available for unstable rustfmt options"
run = '''
if cargo +nightly fmt --version >/dev/null 2>&1; then
  exit 0
fi
rustup toolchain install nightly --component rustfmt --profile minimal --no-self-update \
  || rustup component add rustfmt --toolchain nightly
'''

[tasks.format]
description = "Format Rust code with nightly rustfmt"
depends = ["install:nightly-rustfmt"]
run = "cargo +nightly fmt"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test"

[tasks."test:copy"]
description = "Run mouse-copy integration tests (server frame → client extract)"
run = "cargo test frame_copy_pipeline -- --nocapture"

[tasks.release]
description = "Release-zip macOS / Linux / Windows: native cargo on the host OS, cargo-zigbuild elsewhere"
tools = { zig = "0.14.0", "cargo:cargo-zigbuild" = "0.20.1" }
# Isolated cargo home / target so release binaries do not embed $HOME paths.
# Kept on this task only so mise test / format still use the repo target/.
env = { CARGO_HOME_DIR = "/tmp/zmux-cargo", CARGO_TARGET_DIR = "/tmp/zmux-target", DIST_DIR = "{{vars.dist_dir}}", ZMUX_LINUX_GLIBC = "{{vars.linux_glibc}}" }
run = "bash scripts/release.sh"

[tasks."release:clean"]
description = "Remove release zip artifacts"
run = "rm -rf {{vars.dist_dir}}"
