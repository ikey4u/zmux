[package]
name = "zmux"
version = "0.9.0"
edition = "2021"
description = "Cross-platform terminal multiplexer"
license = "MIT"
build = "build.rs"

[[bin]]
name = "zmux"
path = "src/main.rs"

[workspace]
members = ["crates/zmux-core"]
resolver = "2"

[dependencies]
zmux-core = { path = "crates/zmux-core", version = "0.9.0", features = ["tui"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep line tables so panic-hook backtraces resolve to file:line in the
# deployed binary; "symbols" would strip them and leave only addresses.
strip = "debuginfo"
# Abort the whole process on any panic (the panic hook still runs first, so the
# crash is logged) instead of unwinding a single worker thread and poisoning the
# shared Mutex, which previously caused a silent half-dead cascade.
panic = "abort"

[profile.dev]
panic = "abort"
