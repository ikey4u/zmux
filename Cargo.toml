[package]
name = "zmux"
version = "0.7.0"
edition = "2021"
description = "Cross-platform terminal multiplexer"
license = "MIT"
build = "build.rs"

[[bin]]
name = "zmux"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9"
ratatui = "0.30.1"
crossterm = "0.29"
alacritty_terminal = "0.26"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
arboard = "3"
base64 = "0.22"
png = "0.17"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process", "fs", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPasteboard",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep line tables so panic-hook backtraces resolve to file:line in the
# deployed binary; "symbols" would strip them and leave only addresses.
strip = "debuginfo"
# Abort the whole process on any panic (the panic hook still runs first, so the
# crash is logged) instead of unwinding a single worker thread and poisoning the
# shared Mutex, which previously caused a silent half-dead cascade.
panic = "abort"

[profile.dev]
panic = "abort"
