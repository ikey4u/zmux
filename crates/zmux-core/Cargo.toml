[package]
name = "zmux-core"
version = "0.9.0"
edition = "2021"
description = "Cross-platform terminal multiplexer"
license = "MIT"
build = "build.rs"

[lib]
name = "zmux_core"
path = "src/lib.rs"

[features]
default = []
tui = ["dep:arboard", "ratatui/crossterm_0_29", "ratatui/underline-color", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]

[dependencies]
portable-pty = "0.9"
ratatui = { version = "0.30.1", default-features = false, features = ["std"] }
crossterm = "0.29"
alacritty_terminal = "0.26"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
glob = "0.3"
arboard = { version = "3", optional = true }
base64 = "0.22"
png = "0.17"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process", "fs", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSPasteboard",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
